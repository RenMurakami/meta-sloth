#@TYPE: Machine
#@NAME: sloth-orin-nano-nvme
#@DESCRIPTION: Sloth ECU on Jetson Orin Nano Super devkit, booting from the NVMe SSD (product layout)
require conf/machine/jetson-orin-nano-devkit-nvme.conf
require conf/machine/include/sloth-orin-nano-common.inc

# Disk layout (1 TB NVMe):
#   APP, APP_b   rootfs slots A and B, 48 GiB each
#   /data        48 GiB  settings overlays, OTA staging (/data/ota), logs
#   /rec         the rest of the disk, recordings
# plus about 1.5 GiB of NVIDIA partitions (kernel, kernel-dtb, recovery, esp,
# each A and B).
#
# meta-tegra halves ROOTFSPART_SIZE_DEFAULT for the A/B layout
# (tegra-common.inc), so 96 GiB here gives two 48 GiB slots.  orin-nano.inc's
# default of 28 GiB would give 14 GiB slots.  The size is fixed when the disk
# is flashed: an OTA cannot change it.  Changing it later means a full
# USB-recovery reflash, which also wipes /data and /rec.
ROOTFSPART_SIZE_DEFAULT = "103079215104"

# /data size for systemd-repart (recipes-core/sloth-data).  /rec takes
# whatever is left after it.
SLOTH_DATA_SIZE = "48G"

# Rescue system (recipes-core/images/sloth-rescue-image.bb), written to the
# "recovery" partition.  L4TLauncher boots it when both rootfs slots are
# unbootable.  160 MiB instead of NVIDIA's 80 MiB: the kernel alone is about
# 42 MiB, and the rescue initramfs will grow (SWUpdate, maybe Tailscale and
# Wi-Fi).  recovery_alt grows with it, and the reserved partition before APP
# shrinks by the same amount, so APP, APP_b, /data and /rec do not move
# (recipes-bsp/tegra-binaries/tegra-storage-layout_%.bbappend).  The size is
# fixed in the GPT when the disk is flashed: an OTA cannot change it.
TEGRA_RECOVERY_KERNEL_PART_SIZE = "167772160"
SLOTH_RESCUE_IMAGE = "sloth-rescue-image"

# UEFI boot order: this NVMe first, then the SD card, before USB, network boot
# and the UEFI shell.  (The SD card is no longer the rescue OS; the rescue
# system is in the NVMe's recovery partition, above.)  See
# recipes-bsp/sloth-boot-order for why NVIDIA's BootOrderNvme.dtbo is not
# enough.  :append keeps it after every other overlay, so its
# DefaultBootPriority is the one that applies.
TEGRA_BOOTCONTROL_OVERLAYS:append = " SlothBootOrder.dtbo"
