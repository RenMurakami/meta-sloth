require conf/distro/include/tegrademo.inc

DISTRO = "deer"
DISTRO_NAME = "Deer Detection ECU"
DISTRO_VERSION = "0.1"

# tegrademo defaults to "pam virtualization"; we do not ship containers.
# overlayfs is not in DISTRO_FEATURES_DEFAULTS, so state it explicitly.
DISTRO_FEATURES = "pam overlayfs"

# Yocto 6.0: opt out instead of subtracting.  NEVER opt out of opengl -
# tensorrt-core has REQUIRED_DISTRO_FEATURES = "opengl".
DISTRO_FEATURES_OPTED_OUT += "x11 wayland vulkan bluetooth 3g nfc nfs zeroconf ptest debuginfod"

# The demo's passwordless root is a development convenience, not a product setting.
EXTRA_IMAGE_FEATURES = ""

# A/B from the first flash: retrofitting it later means repartitioning.
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"

# MANDATORY: tegrademo.inc pulls in tegra-support-sanity, which rewrites
# bblayers.conf from templates/<DISTRO>/ - and templates/deer/ does not exist.
INHERIT:remove = "tegra-support-sanity distro_layer_buildinfo"
