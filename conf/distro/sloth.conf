require conf/distro/include/tegrademo.inc

DISTRO = "sloth"
DISTRO_NAME = "Sloth"
DISTRO_VERSION = "0.1"

# tegrademo defaults to "pam virtualization"; we do not ship containers.
# overlayfs is not in DISTRO_FEATURES_DEFAULTS, so state it explicitly.
# (wifi, needed for the RTL8822CE, already comes from DISTRO_FEATURES_DEFAULTS.)
DISTRO_FEATURES = "pam overlayfs"

# Yocto 6.0: opt out instead of subtracting.  NEVER opt out of opengl -
# tensorrt-core has REQUIRED_DISTRO_FEATURES = "opengl".
DISTRO_FEATURES_OPTED_OUT += "x11 wayland vulkan bluetooth 3g nfc nfs zeroconf ptest debuginfod"

# The demo's passwordless root is a development convenience, not a product setting.
EXTRA_IMAGE_FEATURES = ""

# A/B from the first flash: retrofitting it later means repartitioning.
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"

# OTA.  With meta-swupdate in the build, tegrademo.inc (line 1) requires
# meta-tegrademo's tegra-swupdate.inc, which forces TEGRA_MINIMAL_BOOT = "1".
# Undo that here.  A minimal-boot UEFI is headless (no boot menu), has a zero
# timeout and a fixed boot order, and builds L4TLauncher into the firmware:
# the first OTA capsule would install it on the QSPI, after which the
# JetPack install on the NVMe could no longer be booted - and JetPack is how
# the SD card gets written.  The non-minimal path is supported by the same
# swupdate-image-tegra-common.inc: it ships the ESP (L4TLauncher) in the
# .swu as well.
TEGRA_MINIMAL_BOOT = "0"

# MANDATORY: tegrademo.inc pulls in tegra-support-sanity, which rewrites
# bblayers.conf from templates/<DISTRO>/ - and templates/sloth/ does not exist.
INHERIT:remove = "tegra-support-sanity distro_layer_buildinfo"
