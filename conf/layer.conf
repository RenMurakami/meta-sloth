# Deer Detection ECU - product layer
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "deer"
BBFILE_PATTERN_deer = "^${LAYERDIR}/"
BBFILE_PRIORITY_deer = "60"

LAYERDEPENDS_deer = "core tegra openembedded-layer meta-python networking-layer"
LAYERSERIES_COMPAT_deer = "wrynose"

BBFILES_DYNAMIC += "swupdate:${LAYERDIR}/dynamic-layers/meta-swupdate/recipes-*/*/*.bb"
