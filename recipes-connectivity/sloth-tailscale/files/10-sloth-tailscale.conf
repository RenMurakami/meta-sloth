[Unit]
# tailscaled keeps the node's identity (machine and node keys, login, prefs)
# in /var/lib/tailscale, which is an overlay on /data (recipes-core/sloth-data).
# Start after the overlay so the board stays the same tailnet node across
# reboots and OTA updates; on the plain rootfs it would need a new login after
# every update.
After=sloth-data-overlays.service
Wants=sloth-data-overlays.service
