[Unit]
# The per-interface config lives on /data (overlay on /etc/wpa_supplicant,
# recipes-core/sloth-data) so it survives OTA updates.  It is written on the
# device by sloth-wifi-setup and is never part of an image or package.
After=sloth-data-overlays.service
Wants=sloth-data-overlays.service
# No credentials yet: stay inactive instead of failing at every boot.
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-nl80211-%I.conf
